<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="snigup.css">
    <style>
        body, header, .container, footer, nav {
            direction: ltr !important;
            text-align: left !important;
        }
        .card h2, .rules, .main-btn, .secondary-btn, .success {
            text-align: center !important;
        }
        .rules { list-style-position: inside; }
    </style>
</head>
<script>
function validateForm() {
    let success = document.getElementById("success-msg");
    success.innerText = ""; 
    let name = document.getElementById("name");
    let email = document.getElementById("email");
    let password = document.getElementById("password");

    let nameError = document.getElementById("name-error");
    let emailError = document.getElementById("email-error");
    let passwordError = document.getElementById("password-error");

    nameError.innerText = "";
    emailError.innerText = "";
    passwordError.innerText = "";

    name.classList.remove("error-border");
    email.classList.remove("error-border");
    password.classList.remove("error-border");

    let isValid = true;

    if (name.value.trim() === "") {
        nameError.innerText = "❌ Please enter your name";
        name.classList.add("error-border");
        isValid = false;
    }

    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if (email.value.trim() === "") {
        emailError.innerText = "❌ Please enter your email";
        email.classList.add("error-border");
        isValid = false;
    } else if (!email.value.match(emailPattern)) {
        emailError.innerText = "❌ Invalid email format";
        email.classList.add("error-border");
        isValid = false;
    }

    let pass = password.value;
    if (pass.trim() === "") {
        passwordError.innerText = "❌ Please enter a password";
        password.classList.add("error-border");
        isValid = false;
    } else {
        let messages = [];
        if (pass.length < 8) messages.push("• At least 8 characters");
        if (!/[A-Z]/.test(pass)) messages.push("• At least one uppercase letter");
        if (!/[0-9]/.test(pass)) messages.push("• At least one number");
        if (!/[!@#$%^&*]/.test(pass)) messages.push("• At least one special character");

        if (messages.length > 0) {
            passwordError.innerHTML = "❌ Password must contain:<br>" + messages.join("<br>");
            password.classList.add("error-border");
            isValid = false;
        }
    }

    if (isValid) {
        success.innerText = "✅ Account created successfully!";
    }
}
</script>
<body>
    <header>
        <div class="logo">
            <img src="img_2.png" alt="logo">
        </div>
        <nav style="display: flex; gap: 10px; align-items: center;">
            <a href="index-en.html" class="nav-btn">Home</a>
            
            <a href="snigup.html" class="nav-btn" style="background-color: #f0f0f0; color: #333;">العربية</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h2>Create New Account</h2>
            <input type="text" id="name" placeholder="Full Name">
            <p class="error" id="name-error"></p>

            <input type="email" id="email" placeholder="Email Address">
            <p class="error" id="email-error"></p>

            <input type="password" id="password" placeholder="Password">
            <p class="error" id="password-error"></p>

            <ul class="rules">
                <li>Must contain at least 8 characters</li>
                <li>Must contain one uppercase letter</li>
                <li>Must contain one number</li>
                <li>Must contain one special character</li>
            </ul>

            <button onclick="validateForm()" class="main-btn">Sign Up</button>
            <p id="success-msg" class="success"></p>
            <a href="login-en.html" class="secondary-btn">Login</a>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="about-en.html">About Us</a>
            <a href="contact_us-en.html">Contact Us</a>
            <a href="teerms-en.html">Privacy Policy & Terms</a>
            <a href="FAQ-en.html">FAQ</a>
        </div>
    </footer>
</body>
</html>
