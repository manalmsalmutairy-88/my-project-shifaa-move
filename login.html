<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="login.css">
</head>
<script>
function login() {
    let email = document.getElementById("email");
    let password = document.getElementById("password");
    let emailError = document.getElementById("email-error");
    let passwordError = document.getElementById("password-error");

    emailError.innerText = "";
    passwordError.innerText = "";
    email.classList.remove("error-border");
    password.classList.remove("error-border");

    let isValid = true;

    if (email.value.trim() === "") {
        emailError.innerText = "❌ أدخل البريد الإلكتروني";
        email.classList.add("error-border");
        isValid = false;
    }

    if (password.value.trim() === "") {
        passwordError.innerText = "❌ أدخل كلمة المرور";
        password.classList.add("error-border");
        isValid = false;
    }

    if (isValid) {
        localStorage.setItem("isLoggedIn", "true");
        window.location.href = "userpage.html";
    }
}
</script>
<body>

<header>
    <div class="logo">
        <img src="img_2.png" alt="logo">
    </div>

    <nav style="display: flex; gap: 10px; align-items: center;">
        <a href="index.html" class="nav-btn">الصفحة الرئيسية</a>
        
     
        <a href="login-en.html" class="nav-btn" style="background-color: #f0f0f0; color: #333;">English</a>
    </nav>
</header>

<div class="container">
    <div class="card">
        <h2>تسجيل الدخول</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <p id="email-error" class="error"></p>
        <input type="password" id="password" placeholder="كلمة المرور">
        <p id="password-error" class="error"></p>
        <button onclick="login()" class="main-btn">تسجيل الدخول</button>
        <p class="note">ليس لديك حساب؟</p>
        <a href="snigup.html" class="secondary-btn">إنشاء حساب</a>
    </div>
</div>

<footer>
    <div class="footer-links">
        <a href="about.html">من نحن</a>
        <a href="contact_us.html">تواصل معنا</a>
        <a href="teerms.html">سياسة الخصوصية والشروط والأحكام</a>
        <a href="FAQ.html">الأسئلة الشائعة</a>
    </div>
</footer>
</body>
</html>
