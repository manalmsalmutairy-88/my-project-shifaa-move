<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شفاء موف – الأدوات الطبية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tools.css">

<style>
.fav-btn {
    position: absolute;
    top: 10px; left: 10px;
    background: white;
    border: none;
    border-radius: 50%;
    width: 35px; height: 35px;
    font-size: 18px;
    cursor: pointer;
    z-index: 10;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* toast appears after add/remove */
.toast {
    position: fixed;
    bottom: 20px; right: 20px;
    background: #3e6b66;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    display: none;
    z-index: 1000;
}

.section-title {
    background: #3e6b66;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    margin: 30px 0 15px 0;
    font-size: 20px;
    font-weight: bold;
}

/* horizontal scrollable row */
.product-grid {
    display: flex !important;
    overflow-x: auto !important;
    gap: 20px;
    margin-bottom: 30px;
    padding-bottom: 15px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch; /* smooth scroll on iOS */
}

.product-grid::-webkit-scrollbar { height: 6px; }
.product-grid::-webkit-scrollbar-thumb { background: #3e6b66; border-radius: 10px; }

/* flex: 0 0 prevents card from shrinking */
.product-card {
    flex: 0 0 280px;
    position: relative;
    background: white;
    border-radius: 15px;
    padding: 15px;
    border: 1px solid #8b6f6f;
    text-align: center;
    transition: 0.3s;
}

.product-card img {
    width: 100%; height: 180px;
    object-fit: contain;
    background: #fdfdfd;
    border-radius: 10px;
}

.product-card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

.shop-btn {
    display: block;
    margin: 10px auto 0;
    padding: 8px 18px;
    background: #3e6b66;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    transition: 0.2s;
}

.shop-btn:hover { background: #3e6b66; }
</style>

<script>
const sections = [
    {
        title: '1. Hand & Wrist Tools',
        products: [
            { id: 1, label: 'Thumb & Wrist Brace', img: 't1.jpeg', shop: 'https://shortlink.uk/1uxHK' },
            { id: 2, label: 'Hand & Finger Exercise Web', img: 't2.jpeg', shop: 'https://shop.tiriaqq.com/ar/dbEOwKj' },
            { id: 3, label: 'Flex Bar', img: 't3.jpeg', shop: 'https://shop.tiriaqq.com/ar/Yggnbog' },
        ]
    },
    {
        title: '2. Rehabilitation & Transfer Tools',
        products: [
            { id: 4, label: 'Balance Board for Rehabilitation', img: 't4.jpeg', shop: 'https://shop.tiriaqq.com/ar/OqrYAYD' },
            { id: 5, label: 'Medical Transfer Sheet with Handles', img: 't5.jpeg', shop: 'https://shortlink.uk/1uxI0' },
            { id: 6, label: 'Sliding Sheet for Patient Transfer', img: 't6.jpeg', shop: 'https://shortlink.uk/1uxId' },
        ]
    },
    {
        title: '3. Mobility & Support Tools',
        products: [
            { id: 7, label: 'Foldable Electric Wheelchair', img: 't7.jpeg', shop: 'https://shortlink.uk/1uxIx' },
            { id: 8, label: 'Foldable Aluminum Walking Frame', img: 't8.jpeg', shop: 'https://shortlink.uk/1pd1C' },
            { id: 9, label: 'Medical Arm Support', img: 't9.jpeg', shop: 'https://shortlink.uk/1pd1S' },
        ]
    },
    {
        title: '4. Back & Foot Supports',
        products: [
            { id: 10, label: 'Night Foot Splint', img: 't10.jpeg', shop: 'https://shortlink.uk/1uxJI' },
            { id: 11, label: 'Inflatable Walking Boot for Ankle & Foot', img: 't11.jpeg', shop: 'https://goo.su/f3nzT' },
            { id: 12, label: 'Back Brace for Posture Correction', img: 't12.jpeg', shop: 'https://shortlink.uk/1uxfr' },
        ]
    }
];

// read saved tools from localStorage
function getFavs() {
    return JSON.parse(localStorage.getItem('savedTools') || '[]');
}

function saveFavs(favs) {
    localStorage.setItem('savedTools', JSON.stringify(favs));
}

// add or remove tool from favorites
function toggleFav(btn, toolId) {
    let favs = getFavs();
    let toast = document.getElementById("toast");

    if (favs.includes(toolId)) {
        favs = favs.filter(id => id !== toolId);
        btn.innerHTML = "🤍";
        toast.innerHTML = "تمت الإزالة من المفضلة 💔";
    } else {
        favs.push(toolId);
        btn.innerHTML = "❤️";
        toast.innerHTML = "تمت الإضافة للمفضلة ❤️";
    }

    saveFavs(favs);
    toast.style.display = "block";
    setTimeout(() => toast.style.display = "none", 2000);
}

// build the page dynamically from the sections array
function buildPage() {
    const favs = getFavs();
    const main = document.getElementById("main-content");

    sections.forEach(section => {
        const titleDiv = document.createElement('div');
        titleDiv.className = 'section-title';
        titleDiv.textContent = section.title;
        main.appendChild(titleDiv);

        const grid = document.createElement('div');
        grid.className = 'product-grid';

        section.products.forEach(product => {
            const isFav = favs.includes(product.id);
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <button class="fav-btn" onclick="toggleFav(this, ${product.id})">
                    ${isFav ? '❤️' : '🤍'}
                </button>
                <img src="${product.img}" alt="${product.label}">
                <div class="card-label">${product.label}</div>
                <a href="${product.shop}" target="_blank" class="shop-btn">🛒 Purchase Link</a>
            `;
            grid.appendChild(card);
        });

        main.appendChild(grid);
    });
}

window.onload = buildPage;
</script>
</head>

<body>
<header>
  <div class="logo">
    <img src="img_2.png" alt="SHIFAA MOVE">
  </div>
  <nav class="header-nav" style="display: flex; gap: 10px; align-items: center;">
    <button class="nav-btn-home" onclick="location.href='userpage.html'">Back to Home</button>
    <a href="favorites.html" class="nav-btn-home" style="text-decoration: none;">Favorites</a>
    <a href="tools.html" class="nav-btn-home" style="text-decoration: none;">العربية</a>
  </nav>
</header>

<section class="hero">
  <h1>Medical & <span class="accent">Mobility Tools</span></h1>
  <p>Your comprehensive guide to tools that assist movement, rehabilitation, and daily patient comfort.</p>
</section>

<!-- cards are built here by buildPage() -->
<main class="container" id="main-content" style="max-width: 1200px; margin: auto; padding: 20px;"></main>

<footer>
  <div class="footer-links">
    <a href="about-en.html">About Us</a>
    <a href="contact_us-en.html">Contact Us</a>
    <a href="teerms-en.html">Privacy Policy & Terms</a>
    <a href="FAQ-en.html">FAQ</a>
  </div>
</footer>

<div class="toast" id="toast"></div>
</body>
</html>
