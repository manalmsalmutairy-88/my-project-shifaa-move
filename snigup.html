<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب</title>
    <link rel="stylesheet" href="snigup.css">
</head>
<script>
function validateForm() {
    let success = document.getElementById("success-msg");
    success.innerText = ""; 
    let name = document.getElementById("name");
    let email = document.getElementById("email");
    let password = document.getElementById("password");

    let nameError = document.getElementById("name-error");
    let emailError = document.getElementById("email-error");
    let passwordError = document.getElementById("password-error");

    nameError.innerText = "";
    emailError.innerText = "";
    passwordError.innerText = "";

    name.classList.remove("error-border");
    email.classList.remove("error-border");
    password.classList.remove("error-border");

    let isValid = true;

    if (name.value.trim() === "") {
        nameError.innerText = "❌ الرجاء إدخال الاسم";
        name.classList.add("error-border");
        isValid = false;
    }

    let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if (email.value.trim() === "") {
        emailError.innerText = "❌ الرجاء إدخال البريد الإلكتروني";
        email.classList.add("error-border");
        isValid = false;
    } else if (!email.value.match(emailPattern)) {
        emailError.innerText = "❌ صيغة البريد الإلكتروني غير صحيحة";
        email.classList.add("error-border");
        isValid = false;
    }

    let pass = password.value;
    if (pass.trim() === "") {
        passwordError.innerText = "❌ الرجاء إدخال كلمة المرور";
        password.classList.add("error-border");
        isValid = false;
    } else {
        let messages = [];
        if (pass.length < 8) messages.push("• 8 أحرف على الأقل");
        if (!/[A-Z]/.test(pass)) messages.push("• حرف كبير واحد على الأقل");
        if (!/[0-9]/.test(pass)) messages.push("• رقم واحد على الأقل");
        if (!/[!@#$%^&*]/.test(pass)) messages.push("• رمز خاص واحد على الأقل");

        if (messages.length > 0) {
            passwordError.innerHTML = "❌ كلمة المرور يجب أن تحتوي على:<br>" + messages.join("<br>");
            password.classList.add("error-border");
            isValid = false;
        }
    }

    if (isValid) {
        success.innerText = "✅ تم إنشاء الحساب بنجاح!";
    }
}
</script>
<body>
    <header>
        <div class="logo">
            <img src="img_2.png" alt="logo">
        </div>
        <nav style="display: flex; gap: 10px; align-items: center;">
            <a href="index.html" class="nav-btn">الصفحة الرئيسية</a>
            
            <a href="snigup-en.html" class="nav-btn" style="background-color: #f0f0f0; color: #333;">English</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h2>إنشاء حساب جديد</h2>
            <input type="text" id="name" placeholder="الاسم الكامل">
            <p class="error" id="name-error"></p>

            <input type="email" id="email" placeholder="البريد الإلكتروني">
            <p class="error" id="email-error"></p>

            <input type="password" id="password" placeholder="كلمة المرور">
            <p class="error" id="password-error"></p>

            <ul class="rules">
                <li>يجب أن تحتوي على 8 أحرف على الأقل</li>
                <li>يجب أن تحتوي على حرف كبير واحد</li>
                <li>يجب أن تحتوي على رقم واحد</li>
                <li>يجب أن تحتوي على رمز خاص</li>
            </ul>

            <button onclick="validateForm()" class="main-btn">إنشاء حساب</button>
            <p id="success-msg" class="success"></p>
            <a href="login.html" class="secondary-btn">تسجيل الدخول</a>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="about.html">من نحن</a>
            <a href="contact_us.html">تواصل معنا</a>
            <a href="teerms.html">سياسة الخصوصية والشروط والأحكام</a>
            <a href="FAQ.html">الأسئلة الشائعة</a>
        </div>
    </footer>
</body>
</html>
