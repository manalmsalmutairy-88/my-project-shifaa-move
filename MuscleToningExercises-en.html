<style>
.cards {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    padding: 20px;
}

.card {
    width: 300px;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: 0.3s;
    position: relative;
}

.card:hover {
    transform: translateY(-5px);
}

.card h3 {
    background-color: #ddeeee;
    margin: 0;
    padding: 15px;
    font-size: 16px;
    text-align: center;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.video-preview {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
    background: #000;
}

.fav-btn {
    position: absolute;
    top: 10px;
    left: 10px; 
    background: white;
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 20px;
    cursor: pointer;
    z-index: 10;
}

.popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.popup-content {
    position: relative;
    width: 90%;
    max-width: 300px;
}

.popup video {
    width: 100%;
    border-radius: 10px;
}

.close {
    position: absolute;
    top: -40px;
    right: 0;
    font-size: 30px;
    color: white;
    cursor: pointer;
}
</style>

<script>
function openVideo(videoSrc) {
    const popup = document.getElementById("videoPopup");
    const video = document.getElementById("videoPlayer");

    video.src = videoSrc;
    popup.style.display = "flex";
    video.play();
}

function closeVideo() {
    const popup = document.getElementById("videoPopup");
    const video = document.getElementById("videoPlayer");

    video.pause();
    video.src = "";
    popup.style.display = "none";
}

function toggleFav(btn) {
    if (btn.innerHTML.trim() === '🤍') {
        btn.innerHTML = '❤️';
        showFavMessage('Added to favorites ❤️');
    } else {
        btn.innerHTML = '🤍';
        showFavMessage('Removed from favorites 💔');
    }
}

function showFavMessage(text) {
    let msg = document.getElementById("favMessage");

    if (!msg) {
        msg = document.createElement("div");
        msg.id = "favMessage";
        msg.style.position = "fixed";
        msg.style.top = "20px";
        msg.style.left = "50%";
        msg.style.transform = "translateX(-50%)";
        msg.style.background = "#e8fff8";
        msg.style.color = "#0e4a43";
        msg.style.padding = "12px 20px";
        msg.style.borderRadius = "12px";
        msg.style.fontWeight = "bold";
        msg.style.boxShadow = "0 4px 12px rgba(0,0,0,0.15)";
        msg.style.zIndex = "99999";
        document.body.appendChild(msg);
    }

    msg.innerHTML = text;
    msg.style.display = "block";

    setTimeout(() => {
        msg.style.display = "none";
    }, 2000);
}

window.onload = function() {
    const video = document.getElementById("videoPlayer");
    const popup = document.getElementById("videoPopup");

    video.onended = function() {
        closeVideo();
    };

    popup.onclick = function(e) {
        if (e.target.id === "videoPopup") {
            closeVideo();
        }
    };
};
</script>

</head>
